# ─────────────────────────────────────────────────────────────────────────────
# Euron Open CRM: local stack (cloud-agnostic base).
#
# Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# On its own the base runs without any AWS at all: files on local disk, email
# simulated (no AWS_SES_FROM_EMAIL), the SES consumers idle.
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways. `make up-aws`
# also reads deploy/compose/.env.aws, whose values win over the defaults here.
#
# Host ports (override in .env, or in your shell, if they clash with something else):
#   app 3570   console 3580   api 5066   postgres 5532   redis 6469
#   floci 4637   mailpit 8086 (with the Floci overlay)
#
# The two single-page apps are static builds (nginx) that call the API directly at
# http://localhost:5066 (VITE_API_BASE_URL is baked in at build time; CORS_ORIGINS
# admits both). No real account is needed anywhere: WhatsApp, Twilio, Exotel, AI
# calling, Razorpay, Stripe and platform billing all run in their simulated modes, and
# AI uses the deterministic offline engine unless OPENAI_API_KEY, ANTHROPIC_API_KEY or
# GEMINI_API_KEY is set (in .env or your shell).
# ─────────────────────────────────────────────────────────────────────────────
name: open-crm

# Every value an overlay or an env file may want to change is a ${NAME:-default}
# interpolation, so `--env-file .env.aws` (make up-aws) and your shell can set it; the
# overlays then set their own values on top. Precedence, highest first: an overlay's
# `environment:`, your shell, the last --env-file (.env.aws for up-aws, then .env), the
# default below.
x-api-env: &api-env
  # Development mode: the production guards (generated secrets, CORS) only warn, and
  # the stack links to localhost, which production would refuse.
  NODE_ENV: development
  TZ: UTC
  PORT: "5066"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BRAND_NAME: ${CRM_BRAND_NAME:-Open CRM}
  # Where the browser lands (links in emails, booking pages, OAuth and checkout returns).
  CRM_APP_URL: http://localhost:${CRM_WEB_PORT:-3570}
  OPERATOR_APP_URL: http://localhost:${CRM_CONSOLE_PORT:-3580}
  # The API's own public base (unsubscribe links, OAuth callbacks, signed local files).
  APP_PUBLIC_URL: http://localhost:${CRM_API_PORT:-5066}
  CORS_ORIGINS: http://localhost:${CRM_WEB_PORT:-3570},http://localhost:${CRM_CONSOLE_PORT:-3580}
  # The browser talks to the API directly: no proxy hop to trust.
  TRUST_PROXY: "0"
  PG_DATABASE_HOST: postgres
  PG_DATABASE_PORT: "5432"
  PG_DATABASE_USER: crm
  PG_DATABASE_PASSWORD: crm
  PG_DATABASE: crm
  PG_POOL_MAX: ${PG_POOL_MAX:-10}
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${CRM_JWT_SECRET:?run `make env` first}
  # Encrypts every credential a tenant stores (Twilio, Exotel, WhatsApp, payments,
  # integration keys). Changing it makes the stored ones unreadable (re-enter them).
  CREDENTIALS_ENCRYPTION_KEY: ${CRM_CREDENTIALS_ENCRYPTION_KEY:?run `make env` first}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  # Files on local disk unless an overlay (or you) sets a bucket.
  AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
  LOCAL_STORAGE_DIR: /app/.local-storage
  # Every provider simulated by default; set any to false (and add its keys) to go live.
  WHATSAPP_SIMULATE: ${WHATSAPP_SIMULATE:-true}
  TELEPHONY_SIMULATE: ${TELEPHONY_SIMULATE:-true}
  EXOTEL_SIMULATE: ${EXOTEL_SIMULATE:-true}
  RAZORPAY_SIMULATE: ${RAZORPAY_SIMULATE:-true}
  STRIPE_SIMULATE: ${STRIPE_SIMULATE:-true}
  BILLING_SIMULATE: ${BILLING_SIMULATE:-true}
  # Blank: the deterministic offline AI engine.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}

# migrate and api are one image with two commands. Each carries the same build so
# either can be started alone; BuildKit builds it once and reuses the cache.
x-api-build: &api-build
  context: ../..
  dockerfile: infra/docker/api.Dockerfile

services:
  postgres:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      - "127.0.0.1:${CRM_PG_PORT:-5532}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 3s
      timeout: 3s
      retries: 30

  # The BullMQ scheduler behind the recurring jobs, rate limits, the email send limiter
  # and resolver caches. ElastiCache (infra/terraform/modules/cache) on AWS.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${CRM_REDIS_PORT:-6469}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: apply db/migrations, then exit 0. The API waits for it.
  migrate:
    build: *api-build
    image: open-crm-api:local
    command: ["node", "db/migrate.js"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # HTTP on 5066 plus the background jobs (one cluster worker owns them).
  api:
    build: *api-build
    image: open-crm-api:local
    command: ["node", "--enable-source-maps", "dist/index.js"]
    # Anything else in .env (provider keys, extra settings the API reads) reaches the
    # API as is; the explicit environment below wins on conflicts.
    env_file: [.env]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${CRM_API_PORT:-5066}:5066"
    volumes:
      - files:/app/.local-storage
    tmpfs:
      - /tmp:uid=1000,gid=1000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The CRM workspace app (apps/web), static on nginx.
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${CRM_API_PORT:-5066}/api/v1
    image: open-crm-web:local
    ports:
      - "127.0.0.1:${CRM_WEB_PORT:-3570}:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # The operator console (apps/console), static on nginx. Its API base is the operator
  # plane, /api/v1/operator.
  console:
    build:
      context: ../..
      dockerfile: infra/docker/console.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${CRM_API_PORT:-5066}/api/v1/operator
    image: open-crm-console:local
    ports:
      - "127.0.0.1:${CRM_CONSOLE_PORT:-3580}:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  files:
