# ==============================================================================
# Bn Orbit - VPS Production Docker Compose
# ==============================================================================
# Self-contained production stack for a single VPS (Ubuntu 22.04 / 24.04 LTS).
# Runs Postgres, Redis (password-protected), REST API (read-only rootfs),
# Web App, Operator Console, and Edge Nginx (auto HTTP bootstrap -> TLS HTTPS).
#
# First deploy & SSL issuance:
#   chmod +x deploy/vps/scripts/*.sh
#   ./deploy/vps/scripts/init-ssl.sh
# ==============================================================================

name: bn-orbit-prod

services:
  # ---- 1. Database (PostgreSQL 16) ----
  postgres:
    image: postgres:16.12-alpine
    container_name: bn-orbit-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${PG_DATABASE:-crm}
      POSTGRES_USER: ${PG_DATABASE_USER:-crm}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?Set PG_DATABASE_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATABASE_USER:-crm} -d ${PG_DATABASE:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal-net

  # ---- 2. Cache & Message Queue (Redis 7, authenticated) ----
  redis:
    image: redis:7.4-alpine
    container_name: bn-orbit-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal-net

  # ---- 3. Database Migration Runner (One-Shot) ----
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    image: bn-orbit-api:prod
    container_name: bn-orbit-migrate
    security_opt:
      - no-new-privileges:true
    command: ["node", "db/migrate.js"]
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PG_DATABASE_HOST: postgres
      PG_DATABASE_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - internal-net

  # ---- 4. Backend REST API & Background Worker ----
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    image: bn-orbit-api:prod
    container_name: bn-orbit-api
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000
    command: ["node", "--enable-source-maps", "dist/index.js"]
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: "5066"
      PG_DATABASE_HOST: postgres
      PG_DATABASE_PORT: "5432"
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      TRUST_PROXY: "1"
      LOCAL_STORAGE_DIR: /app/.local-storage
    volumes:
      - files:/app/.local-storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - internal-net

  # ---- 5. Main CRM Web Application (React SPA on Nginx) ----
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: bn-orbit-web:prod
    container_name: bn-orbit-web
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal-net

  # ---- 6. Operator Console (Platform Superadmin SPA on Nginx) ----
  console:
    build:
      context: ../..
      dockerfile: infra/docker/console.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1/operator
    image: bn-orbit-console:prod
    container_name: bn-orbit-console
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal-net

  # ---- 7. Edge Nginx Reverse Proxy (ACME Bootstrap -> TLS & Domain Routing) ----
  edge-nginx:
    image: nginx:1.27-alpine
    container_name: bn-orbit-edge-nginx
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?Set CRM_DOMAIN in .env.prod}
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:?Set CONSOLE_DOMAIN in .env.prod}
    volumes:
      - ./nginx/render-and-run.sh:/etc/nginx/entrypoint/render-and-run.sh:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: ["/bin/sh", "/etc/nginx/entrypoint/render-and-run.sh"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      web:
        condition: service_healthy
      console:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - internal-net

volumes:
  pgdata:
  redisdata:
  files:
  certbot_conf:
  certbot_www:

networks:
  internal-net:
    driver: bridge
