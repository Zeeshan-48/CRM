# ==============================================================================
# Bn Orbit - VPS Edge Nginx Configuration
# ==============================================================================
# Handles SSL Termination, Reverse Proxy, Static Caching, and 50MB Uploads.
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # File Upload Limits (50 MB for recordings, PDFs, attachments)
    client_max_body_size 50M;

    # Upstream Services (Docker Internal Network)
    upstream crm_web {
        server web:8080;
    }

    upstream crm_console {
        server console:8080;
    }

    upstream crm_api {
        server api:5066;
    }

    # -------------------------------------------------------------------------
    # HTTP -> HTTPS Redirect & ACME Certbot Challenge
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Let's Encrypt domain validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # Main CRM Workspace App (e.g. crm.yourdomain.com)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name crm.example.com; # Replace with your real domain

        # SSL Certificates (Auto-generated by Certbot)
        ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Backend REST API Routing
        location /api/ {
            proxy_pass http://crm_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for realtime events
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 90s;
        }

        # Frontend React Web Application
        location / {
            proxy_pass http://crm_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # -------------------------------------------------------------------------
    # Operator Console App (e.g. console.yourdomain.com)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name console.example.com; # Replace with your real console domain

        ssl_certificate     /etc/letsencrypt/live/console.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Backend Operator API Routing
        location /api/ {
            proxy_pass http://crm_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Frontend React Operator Console
        location / {
            proxy_pass http://crm_console;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

