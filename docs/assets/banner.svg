<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Euron Open CRM</title>
  <desc id="d">Euron Open CRM: a self-hosted, multi-tenant CRM. Leads, deals, an inbox over email and WhatsApp, campaigns, tickets, workflows, telephony, an AI copilot and product signals, with an operator console that sells plans and bills tenants.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#170C14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C0267E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C0267E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="r"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <circle cx="960" cy="180" r="190" fill="url(#glow)"/>

    <g transform="translate(72 70)">
      <rect width="56" height="56" rx="16" fill="#F5F7FA"/>
      <rect x="13" y="16" width="7" height="24" rx="3.5" fill="#0B1220"/>
      <rect x="24.5" y="16" width="7" height="17" rx="3.5" fill="#0B1220"/>
      <rect x="36" y="16" width="7" height="10" rx="3.5" fill="#C0267E"/>
    </g>
    <text x="144" y="110" font-family="Bricolage Grotesque, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#F5F7FA">Euron Open CRM</text>

    <text x="72" y="190" font-family="Bricolage Grotesque, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Every customer, one workspace.</text>
    <text x="72" y="232" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#C7CDD8">Leads, deals, email and WhatsApp, tickets, calls and product signals,</text>
    <text x="72" y="258" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#C7CDD8">for many workspaces on one deployment you run.</text>
    <text x="72" y="310" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E58AC0" letter-spacing="1.6">MULTI-TENANT  ·  WORKFLOWS  ·  AI COPILOT  ·  TELEPHONY  ·  PLANS + BILLING</text>

    <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" transform="translate(820 64)">
      <g font-size="12" font-weight="600" fill="#9AA3B2" letter-spacing="1">
        <text x="0" y="0">QUALIFIED</text>
        <text x="132" y="0">PROPOSAL</text>
        <text x="264" y="0">WON</text>
      </g>
      <g fill="none" stroke="#2A3242" stroke-width="1.5">
        <path d="M0 14 H110 M132 14 H242 M264 14 H374"/>
      </g>
      <g>
        <rect x="0" y="30" width="110" height="58" rx="8" fill="#141B2B" stroke="#2A3242"/>
        <rect x="12" y="44" width="62" height="8" rx="4" fill="#E5E8EE"/>
        <rect x="12" y="62" width="86" height="4" rx="2" fill="#2A3242"/><rect x="12" y="62" width="30" height="4" rx="2" fill="#C0267E"/>
        <rect x="0" y="100" width="110" height="58" rx="8" fill="#141B2B" stroke="#2A3242"/>
        <rect x="12" y="114" width="48" height="8" rx="4" fill="#E5E8EE"/>
        <rect x="12" y="132" width="86" height="4" rx="2" fill="#2A3242"/><rect x="12" y="132" width="20" height="4" rx="2" fill="#C0267E"/>
        <rect x="0" y="170" width="110" height="58" rx="8" fill="#141B2B" stroke="#2A3242"/>
        <rect x="12" y="184" width="70" height="8" rx="4" fill="#E5E8EE"/>
        <rect x="12" y="202" width="86" height="4" rx="2" fill="#2A3242"/><rect x="12" y="202" width="40" height="4" rx="2" fill="#C0267E"/>

        <rect x="132" y="30" width="110" height="58" rx="8" fill="#141B2B" stroke="#2A3242"/>
        <rect x="144" y="44" width="56" height="8" rx="4" fill="#E5E8EE"/>
        <rect x="144" y="62" width="86" height="4" rx="2" fill="#2A3242"/><rect x="144" y="62" width="58" height="4" rx="2" fill="#C0267E"/>
        <rect x="132" y="100" width="110" height="58" rx="8" fill="#141B2B" stroke="#C0267E" stroke-width="1.5"/>
        <rect x="144" y="114" width="66" height="8" rx="4" fill="#FFFFFF"/>
        <rect x="144" y="132" width="86" height="4" rx="2" fill="#2A3242"/><rect x="144" y="132" width="70" height="4" rx="2" fill="#C0267E"/>

        <rect x="264" y="30" width="110" height="58" rx="8" fill="#141B2B" stroke="#2A3242"/>
        <rect x="276" y="44" width="60" height="8" rx="4" fill="#E5E8EE"/>
        <rect x="276" y="62" width="86" height="4" rx="2" fill="#C0267E"/>
      </g>
      <g font-size="13" fill="#E5E8EE">
        <circle cx="6" cy="248" r="5" fill="#C0267E"/><text x="18" y="253">Signal: pricing viewed 3x</text>
        <circle cx="6" cy="272" r="5" fill="#C7CDD8"/><text x="18" y="277">WhatsApp: "Yes please, interested."</text>
      </g>
    </g>
  </g>
</svg>
