<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Euron Open CRM in context</title>
  <desc id="desc">Workspace staff and prospects use the tenant app; operator staff use the operator console. Both static apps call one API with bearer tokens. Connected products call the ingest plane with crm_sk_ or crm_pk_ keys and receive signed webhooks and actions. The API stores data in PostgreSQL, uses Redis for the job schedule and rate limits, and keeps files in S3 or on local disk. It calls SES, the WhatsApp Cloud API, Twilio and Exotel, Razorpay and Stripe, optional AI providers and Google Calendar, which call back through signed webhooks or URL tokens.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
    .acc { fill: #fdeef6; stroke: #c0267e; stroke-width: 1.6; }
    .ext { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .zone { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .h { font: 600 20px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .t { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .s { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
    .m { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
    .k { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #a01f69; }
    .ln { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .ld { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .la { stroke: #c0267e; stroke-width: 1.8; fill: none; }
    .ah { fill: #64748b; }
    .aa { fill: #c0267e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box, .ext { fill: #111a2b; stroke: #2b3a55; }
      .acc { fill: #3a0f27; stroke: #e56ab0; }
      .zone { stroke: #475569; }
      .h, .t, .m { fill: #e2e8f0; }
      .s { fill: #94a3b8; }
      .k { fill: #f09ac8; }
      .ln, .ld { stroke: #7c8aa5; }
      .ah { fill: #7c8aa5; }
      .la { stroke: #e56ab0; }
      .aa { fill: #e56ab0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aa" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" width="1200" height="620" rx="14"/>
  <text class="h" x="40" y="48">Euron Open CRM in context</text>
  <text class="s" x="40" y="70">Every external service on the right is optional: without keys it runs simulated.</text>

  <rect class="box" x="40" y="110" width="200" height="60" rx="10"/>
  <text class="t" x="56" y="136">Workspace staff</text>
  <text class="s" x="56" y="157">browser</text>
  <rect class="box" x="40" y="182" width="200" height="50" rx="10"/>
  <text class="t" x="56" y="204">Prospect</text>
  <text class="s" x="56" y="223">public booking page</text>
  <rect class="box" x="40" y="250" width="200" height="60" rx="10"/>
  <text class="t" x="56" y="276">Operator staff</text>
  <text class="s" x="56" y="297">browser</text>
  <rect class="ext" x="40" y="380" width="200" height="110" rx="10"/>
  <text class="t" x="56" y="406">Connected product</text>
  <text class="s" x="56" y="428">server: @open-crm/sdk</text>
  <text class="s" x="56" y="448">pages: tracker t.js</text>
  <text class="s" x="56" y="468">gets webhooks, actions</text>

  <rect class="zone" x="280" y="80" width="580" height="500" rx="14"/>
  <text class="t" x="300" y="102">Your deployment</text>

  <rect class="box" x="310" y="110" width="200" height="60" rx="10"/>
  <text class="t" x="326" y="136">Tenant app</text>
  <text class="s" x="326" y="157">apps/web, static SPA</text>
  <rect class="box" x="310" y="250" width="200" height="60" rx="10"/>
  <text class="t" x="326" y="276">Operator console</text>
  <text class="s" x="326" y="297">apps/console, static SPA</text>

  <rect class="acc" x="560" y="110" width="270" height="250" rx="10"/>
  <text class="t" x="576" y="136">API (Express, Node cluster)</text>
  <text class="m" x="576" y="162">/api/v1</text>
  <text class="s" x="660" y="162">tenant plane</text>
  <text class="m" x="576" y="186">/api/v1/operator</text>
  <text class="s" x="576" y="206">operator plane, billing hooks</text>
  <text class="m" x="576" y="230">/api/v1/ingest</text>
  <text class="s" x="576" y="250">product events, catalog</text>
  <text class="m" x="576" y="274">/api/v1/wa, /telephony</text>
  <text class="s" x="576" y="294">provider callbacks</text>
  <text class="s" x="576" y="322">one worker runs the jobs:</text>
  <text class="s" x="576" y="342">14 sweeps, 2 SQS consumers</text>

  <rect class="box" x="560" y="400" width="130" height="56" rx="10"/>
  <text class="t" x="576" y="434">PostgreSQL</text>
  <rect class="box" x="700" y="400" width="130" height="56" rx="10"/>
  <text class="t" x="716" y="434">Redis</text>
  <rect class="box" x="560" y="470" width="270" height="56" rx="10"/>
  <text class="t" x="576" y="496">Files</text>
  <text class="s" x="576" y="515">S3 bucket, or local disk with signed links</text>
  <text class="s" x="310" y="400">Postgres: all CRM data,</text>
  <text class="s" x="310" y="420">entitlements, encrypted secrets.</text>
  <text class="s" x="310" y="448">Redis: job schedule, rate limits,</text>
  <text class="s" x="310" y="468">send throttle. Optional in dev.</text>

  <path class="ln" d="M240 140 L308 140" marker-end="url(#a)"/>
  <path class="ln" d="M240 207 L275 207 L275 160 L308 160" marker-end="url(#a)"/>
  <path class="ln" d="M240 280 L308 280" marker-end="url(#a)"/>
  <path class="la" d="M510 140 L558 140" marker-end="url(#b)"/>
  <text class="k" x="514" y="130">JWT</text>
  <path class="la" d="M510 280 L558 280" marker-end="url(#b)"/>
  <text class="k" x="514" y="270">JWT</text>
  <path class="la" d="M240 425 L292 425 L292 345 L558 345" marker-end="url(#b)"/>
  <text class="k" x="300" y="337">crm_sk_ / crm_pk_</text>
  <path class="ln" d="M625 360 L625 398" marker-end="url(#a)"/>
  <path class="ln" d="M765 360 L765 398" marker-end="url(#a)"/>
  <path class="ln" d="M830 330 L848 330 L848 498 L832 498" marker-end="url(#a)"/>

  <rect class="ext" x="900" y="96" width="260" height="62" rx="10"/>
  <text class="t" x="916" y="122">Email: SES</text>
  <text class="s" x="916" y="143">SNS and SQS for events, inbound</text>
  <rect class="ext" x="900" y="170" width="260" height="62" rx="10"/>
  <text class="t" x="916" y="196">WhatsApp Cloud API</text>
  <text class="s" x="916" y="217">signed webhooks back</text>
  <rect class="ext" x="900" y="244" width="260" height="62" rx="10"/>
  <text class="t" x="916" y="270">Telephony</text>
  <text class="s" x="916" y="291">Twilio, Exotel (URL token)</text>
  <rect class="ext" x="900" y="318" width="260" height="62" rx="10"/>
  <text class="t" x="916" y="344">Payments</text>
  <text class="s" x="916" y="365">Razorpay, Stripe</text>
  <rect class="ext" x="900" y="392" width="260" height="62" rx="10"/>
  <text class="t" x="916" y="418">AI providers</text>
  <text class="s" x="916" y="439">OpenAI, Anthropic, Gemini</text>
  <rect class="ext" x="900" y="466" width="260" height="62" rx="10"/>
  <text class="t" x="916" y="492">Google Calendar</text>
  <text class="s" x="916" y="513">per-user OAuth</text>

  <path class="la" d="M830 200 L878 200"/>
  <path class="la" d="M878 127 L878 497"/>
  <path class="ln" d="M878 127 L898 127" marker-end="url(#a)"/>
  <path class="ln" d="M878 201 L898 201" marker-end="url(#a)"/>
  <path class="ln" d="M878 275 L898 275" marker-end="url(#a)"/>
  <path class="ln" d="M878 349 L898 349" marker-end="url(#a)"/>
  <path class="ln" d="M878 423 L898 423" marker-end="url(#a)"/>
  <path class="ln" d="M878 497 L898 497" marker-end="url(#a)"/>
</svg>
