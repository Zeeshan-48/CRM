name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security issues: do not file here**, follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Say where (the workspace app or the operator console), which role you were (admin, manager, sales, support, marketing, finance, operator), and for provider problems which provider (WhatsApp, Twilio, Exotel, SES, Razorpay, Stripe, an AI provider) and whether it was live or simulated.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make up && make demo
        2. Sign in at http://localhost:3570 as maya@northwind.example.com
        3. ...
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: ["Local (make up on Floci)", "Local against AWS (make up-aws)", "AWS (Terraform)", "Self-hosted (other)", "Other"]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Leads, contacts and accounts", "Deals and pipeline", "Inbox (email, WhatsApp)", "Campaigns and email sending", "Tickets and support", "Workflows and automation", "Telephony (Twilio, Exotel, AI calling)", "AI copilot", "Product ingest and SDK", "Calendar and booking", "Payments (Razorpay, Stripe)", "Operator console, plans and billing", "Account and sign-in", "Deployment and infrastructure", "Other"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact keys, tokens and hostnames before pasting.
      render: text
